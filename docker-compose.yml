services:
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile.openvpn
    container_name: openvpn-server
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1194:1194/udp"
    volumes:
      - ./data/config:/etc/openvpn
      - ./data/users:/etc/openvpn/users
      - ./data/state:/etc/openvpn/state
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VPN_PORT=1194
      - VPN_PROTO=udp
      - VPN_DNS1=${VPN_DNS1:-1.1.1.1}
      - VPN_DNS2=${VPN_DNS2:-8.8.8.8}
      - VPN_DCO=${VPN_DCO:-auto}
      - VPN_MSSFIX=${VPN_MSSFIX:-1360}
      - VPN_TUN_MTU=${VPN_TUN_MTU:-1420}
      # 1 = bitta hisob bir nechta qurilmada ishlaydi (telefon + noutbuk).
      - VPN_DUPLICATE_CN=${VPN_DUPLICATE_CN:-1}
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD-SHELL", "pgrep openvpn > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vpn-web-panel
    ports:
      - "127.0.0.1:8080:8080"
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data/users:/etc/openvpn/users
      - ./data/state:/app/state
      - ./data/ovpn:/app/ovpn
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # Standart qiymat ataylab yo'q: noto'g'ri IP jimgina .ovpn ichiga tushib
      # ketgandan ko'ra, umuman ko'rsatilmagani bilinib turgani yaxshiroq.
      - SERVER_IP=${SERVER_IP:?SERVER_IP .env da ko'rsatilishi shart (klientlar ulanadigan tashqi IP yoki domen)}
      - VPN_PORT=1194
      - VPN_PROTO=udp
      - VPN_TUN_MTU=${VPN_TUN_MTU:-1420}
      # 1 = bitta hisob bir nechta qurilmada ishlaydi (telefon + noutbuk).
      - VPN_DUPLICATE_CN=${VPN_DUPLICATE_CN:-1}
      - VPN_MSSFIX=${VPN_MSSFIX:-1360}
      - SECURE_COOKIES=${SECURE_COOKIES:-auto}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - INACTIVE_DISABLE_DAYS=${INACTIVE_DISABLE_DAYS:-30}
      - INACTIVE_DELETE_DAYS=${INACTIVE_DELETE_DAYS:-45}
    depends_on:
      - openvpn
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
