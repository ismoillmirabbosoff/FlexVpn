# Docker loglari cheksiz o'sib diskni to'ldirmasin — disk to'lsa VPN ham, panel ham to'xtaydi.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile.openvpn
    container_name: openvpn-server
    # tini PID 1 sifatida: fonda ishlaydigan auth jarayonlarini yig'adi (zombie
    # qolmaydi) va SIGTERM ni openvpn ga to'g'ri uzatadi.
    init: true
    # openvpn to'xtashdan oldin klientlarga RESTART yuborib ulgursin.
    stop_grace_period: 20s
    logging: *logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # TCP 443: provayder OpenVPN UDP ni bloklagani uchun (.env: VPN_PORT, VPN_PROTO).
      - "${VPN_PORT:-443}:${VPN_PORT:-443}/${VPN_PROTO:-tcp}"
    volumes:
      - ./data/config:/etc/openvpn
      - ./data/users:/etc/openvpn/users
      - ./data/state:/etc/openvpn/state
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VPN_PORT=${VPN_PORT:-443}
      - VPN_PROTO=${VPN_PROTO:-tcp}
      - VPN_DNS1=${VPN_DNS1:-1.1.1.1}
      - VPN_DNS2=${VPN_DNS2:-8.8.8.8}
      - VPN_DCO=${VPN_DCO:-0}
      - VPN_MSSFIX=${VPN_MSSFIX:-1360}
      - VPN_TUN_MTU=${VPN_TUN_MTU:-1420}
      - VPN_MAX_CLIENTS=${VPN_MAX_CLIENTS:-250}
      - VPN_SOCK_BUF=${VPN_SOCK_BUF:-4194304}
      # 1 = bitta hisob bir nechta qurilmada ishlaydi (telefon + noutbuk).
      - VPN_DUPLICATE_CN=${VPN_DUPLICATE_CN:-1}
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD-SHELL", "pgrep openvpn > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vpn-web-panel
    init: true
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data/users:/etc/openvpn/users
      - ./data/state:/app/state
      - ./data/ovpn:/app/ovpn
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - SECRET_KEY=${SECRET_KEY:-}
      # Standart qiymat ataylab yo'q: noto'g'ri IP jimgina .ovpn ichiga tushib
      # ketgandan ko'ra, umuman ko'rsatilmagani bilinib turgani yaxshiroq.
      - SERVER_IP=${SERVER_IP:?SERVER_IP .env da ko'rsatilishi shart (klientlar ulanadigan tashqi IP yoki domen)}
      - VPN_PORT=${VPN_PORT:-443}
      - VPN_PROTO=${VPN_PROTO:-tcp}
      - VPN_TUN_MTU=${VPN_TUN_MTU:-1420}
      # 1 = bitta hisob bir nechta qurilmada ishlaydi (telefon + noutbuk).
      - VPN_DUPLICATE_CN=${VPN_DUPLICATE_CN:-1}
      - VPN_MSSFIX=${VPN_MSSFIX:-1360}
      - SECURE_COOKIES=${SECURE_COOKIES:-auto}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - INACTIVE_DISABLE_DAYS=${INACTIVE_DISABLE_DAYS:-30}
      - INACTIVE_DELETE_DAYS=${INACTIVE_DELETE_DAYS:-45}
    depends_on:
      - openvpn
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
