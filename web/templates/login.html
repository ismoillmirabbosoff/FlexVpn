{% extends "base.html" %}
{% block title %}Kirish — VPN Panel{% endblock %}

{% block guest %}
<div class="login-page">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand-text">
        <strong>VPN Panel</strong>
        <span>OpenVPN boshqaruvi</span>
      </div>
    </div>

    {% include "_flashes.html" %}

    <div class="login-card">
      <h1>Xush kelibsiz</h1>
      <p>Davom etish uchun admin hisobiga kiring</p>

      <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
          <label for="username">Login</label>
          <input class="input" id="username" name="username" autocomplete="username"
                 required autofocus spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <button class="btn btn-icon" type="button" data-reveal="password" aria-label="Parolni ko'rsatish">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px">Kirish</button>
      </form>
    </div>

    <div class="login-foot">
      <button class="btn btn-quiet btn-sm" type="button" data-theme-toggle>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" data-theme-icon="moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" data-theme-icon="sun" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <span data-theme-label>Qorong'i mavzu</span>
      </button>
    </div>
  </div>
</div>
{% endblock %}
